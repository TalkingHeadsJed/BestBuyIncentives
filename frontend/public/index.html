<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FFD300" />

        <!-- Audience Lab (idpixel) traffic analytics -->
        <script src="https://cdn.idpixel.app/v1/idp-analytics-6a6259b025409f3b40903a4f.min.js" defer></script>

        <!-- Per-page title, description, canonical, Open Graph & Twitter tags are
             injected at build time by the prerenderer (react-helmet) so every route
             ships unique, static <head> metadata. -->

        <!-- Performance -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="dns-prefetch" href="https://assets.calendly.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <!-- Organization & WebSite entities are defined ONCE, canonically, by
             src/components/site/Seo.jsx (@id #organization / #website) and are
             injected into every prerendered page head. They are intentionally
             NOT duplicated here to avoid conflicting entity definitions. -->

        <!-- Structured data · Service -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Service",
          "serviceType": "Sales Incentive Programs",
          "provider": {
            "@id": "https://bestbuyincentives.com/#organization"
          },
          "areaServed": ["United States", "Canada"],
          "description": "Premium travel-incentive certificates deployed to high-ticket sales teams as a closing tool. Used by auto dealerships, jewelers, furniture retailers, home-improvement companies, e-commerce retailers, travel clubs, health clubs, employee-rewards programs, luxury retail, and B2B sales organizations.",
          "audience": {
            "@type": "BusinessAudience",
            "audienceType": "Sales VPs, Sales Managers, Business Owners"
          }
        }
        </script>

        <!-- WebSite entity is defined canonically by Seo.jsx (@id #website). -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
