<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FFD300" />

        <!-- Per-page title, description, canonical, Open Graph & Twitter tags are
             injected at build time by the prerenderer (react-helmet) so every route
             ships unique, static <head> metadata. -->

        <!-- Performance -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="dns-prefetch" href="https://assets.calendly.com" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <!-- Structured data · Organization -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": "https://bestbuyincentives.com/#organization",
          "name": "BestBuyIncentives",
          "alternateName": "Best Buy Incentives",
          "url": "https://bestbuyincentives.com/",
          "logo": "https://bestbuyincentives.com/images/hero-seminar.png",
          "description": "Premium travel-incentive certificate programs for high-ticket sales teams. Lift close rates without cutting price.",
          "foundingDate": "1992",
          "slogan": "Stop Discounting. Start Closing.",
          "email": "sales@bestbuyincentives.com",
          "telephone": "+1-866-843-8003",
          "legalName": "Karl Kramer & Company, Inc.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "3089 Shore Road",
            "addressLocality": "Bellmore",
            "addressRegion": "NY",
            "postalCode": "11710",
            "addressCountry": "US"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-866-843-8003",
            "contactType": "sales",
            "areaServed": ["US", "CA"],
            "availableLanguage": "English"
          },
          "sameAs": [
            "https://www.youtube.com/@Bestbuyincentives",
            "https://www.facebook.com/profile.php?id=61591196589436",
            "https://www.instagram.com/best_buy_incentives/",
            "https://www.linkedin.com/in/karl-kramer-34803516a/"
          ],
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "reviewCount": "1200",
            "bestRating": "5",
            "worstRating": "1"
          }
        }
        </script>

        <!-- Structured data · Service -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Service",
          "serviceType": "Sales Incentive Programs",
          "provider": {
            "@id": "https://bestbuyincentives.com/#organization"
          },
          "areaServed": ["United States", "Canada"],
          "description": "Premium travel-incentive certificates deployed to high-ticket sales teams as a closing tool. Used by auto dealerships, jewelers, furniture retailers, home-improvement companies, flooring, mattress, luxury retail, and B2B sales organizations.",
          "audience": {
            "@type": "BusinessAudience",
            "audienceType": "Sales VPs, Sales Managers, Business Owners"
          }
        }
        </script>

        <!-- Structured data · WebSite -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://bestbuyincentives.com/#website",
          "url": "https://bestbuyincentives.com/",
          "name": "BestBuyIncentives",
          "publisher": { "@id": "https://bestbuyincentives.com/#organization" },
          "inLanguage": "en-US"
        }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
